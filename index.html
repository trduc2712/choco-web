<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#ffffff"
      data-theme-color="light"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#111110"
      data-theme-color="dark"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="description"
      content="Share posts and join conversations on Choco."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Choco" />
    <meta property="og:title" content="Choco" />
    <meta
      property="og:description"
      content="Share posts and join conversations on Choco."
    />
    <meta
      property="og:image"
      content="https://choco-web-staging.vercel.app/choco-preview.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Choco" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Choco" />
    <meta
      name="twitter:description"
      content="Share posts and join conversations on Choco."
    />
    <meta
      name="twitter:image"
      content="https://choco-web-staging.vercel.app/choco-preview.png"
    />
    <meta name="twitter:image:alt" content="Choco" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/inter/files/inter-vietnamese-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Choco</title>
    <script>
      try {
        const theme = localStorage.getItem('theme')
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme
          for (const meta of document.querySelectorAll(
            'meta[name="theme-color"]',
          )) {
            meta.setAttribute(
              'media',
              meta.dataset.themeColor === theme ? 'all' : 'not all',
            )
          }
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
